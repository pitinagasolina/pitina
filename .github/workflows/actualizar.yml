
name: Actualizar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-26.04

    steps:
      # 1. Descargar repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v5

      # 2. Resolver IPNS de lista 1
      - name: Resolver IPNS de lista 1
        env:
          IPNS_NAME_1: "k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs"
        run: |
          set -e

          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            "https://delegated-ipfs.dev/routing/v1/ipns/$IPNS_NAME_1" \
            -o ipns-record-1.bin

          CID_1=$(strings ipns-record-1.bin \
            | grep -oE '/ipfs/[A-Za-z0-9]+' \
            | head -n 1 \
            | sed 's#^/ipfs/##' || true)

          if [ -z "$CID_1" ]; then
            echo "ERROR: No se pudo obtener el CID de la lista 1."
            exit 1
          fi

          echo "CID lista 1: $CID_1"
          echo "IPFS_CID_1=$CID_1" >> "$GITHUB_ENV"

      # 3. Descargar lista 1 desde IPFS
      - name: Descargar lista 1
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://gateway.pinata.cloud/ipfs/$IPFS_CID_1/hashes.m3u" \
            -o lista1.m3u

          test -s lista1.m3u

      # 4. Descargar lista 2 desde GitHub
      - name: Descargar lista 2
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://raw.githubusercontent.com/pitinagasolina/pitina/refs/heads/main/base.m3u" \
            -o lista2.m3u

          test -s lista2.m3u

      # 5. Descargar lista 3 desde GitHub
      - name: Descargar lista 3
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://raw.githubusercontent.com/pitinagasolina/pitina/refs/heads/main/base2.m3u" \
            -o lista3.m3u

          test -s lista3.m3u

      # 6. Comprobar descargas
      - name: Comprobar descargas
        run: |
          set -e

          for FILE in lista1.m3u lista2.m3u lista3.m3u; do
            test -s "$FILE"
            grep -q "^#EXTM3U" "$FILE"
            echo "$FILE: $(wc -c < "$FILE") bytes"
          done

      # 7. Combinar listas, eliminar duplicados y normalizar enlaces
      - name: Combinar listas
        run: |
          set -e

          python3 <<'PY'
          import re
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.parse import urlsplit, parse_qs, unquote

          SOURCES = [
              Path("lista1.m3u"),
              Path("lista2.m3u"),
              Path("lista3.m3u")
          ]

          OUTPUT = Path("pitina.m3u")

          LOCAL_PREFIX = (
              "http://127.0.0.1:6878/ace/getstream?id="
          )

          ACE_PATTERN = re.compile(
              r'acestream://([^\s"\'<>]+)',
              re.IGNORECASE
          )

          GETSTREAM_PATTERN = re.compile(
              r'getstream\?[^ \t"\'<>]*',
              re.IGNORECASE
          )

          def parse_playlist(path):
              lines = path.read_text(
                  encoding="utf-8-sig",
                  errors="replace"
              ).splitlines()

              header = []
              entries = []
              current = None

              for line in lines:
                  if line.startswith("#EXTINF:"):
                      if current:
                          entries.append(current)

                      current = [line]

                  elif current is None:
                      header.append(line)

                  else:
                      current.append(line)

              if current:
                  entries.append(current)

              return header, entries

          def extract_ids(entry):
              identifiers = set()

              for line in entry:

                  # Extraer IDs de acestream://
                  for match in ACE_PATTERN.findall(line):
                      identifiers.add(
                          unquote(match).strip().lower()
                      )

                  # Extraer IDs de getstream?id=
                  if "getstream" in line.lower():
                      matches = GETSTREAM_PATTERN.findall(line)

                      for match in matches:
                          try:
                              query = urlsplit(
                                  "http://placeholder/" + match
                              ).query

                              params = parse_qs(query)

                              for value in params.get("id", []):
                                  value = unquote(value).strip()

                                  if value:
                                      identifiers.add(
                                          value.lower()
                                      )

                          except Exception:
                              pass

              return identifiers

          def normalize_entry(entry):
              normalized = []

              for line in entry:

                  # Convertir acestream:// a AceServe
                  line = ACE_PATTERN.sub(
                      lambda m: LOCAL_PREFIX + m.group(1),
                      line
                  )

                  # Convertir enlaces getstream?id= al formato local
                  if "getstream" in line.lower():

                      def replace_getstream(match):
                          try:
                              parsed = urlsplit(
                                  "http://placeholder/" + match.group(0)
                              )

                              params = parse_qs(parsed.query)
                              ids = params.get("id", [])

                              if not ids:
                                  return match.group(0)

                              return LOCAL_PREFIX + ids[0]

                          except Exception:
                              return match.group(0)

                      line = GETSTREAM_PATTERN.sub(
                          replace_getstream,
                          line
                      )

                  normalized.append(line)

              return normalized

          # La lista 1 es siempre la base
          header, base_entries = parse_playlist(SOURCES[0])

          if not base_entries:
              raise SystemExit(
                  "ERROR: La lista 1 no contiene canales."
              )

          seen_ids = set()
          final_entries = []

          stats = {
              "lista1": 0,
              "lista2": 0,
              "lista3": 0
          }

          duplicates = {
              "lista1": 0,
              "lista2": 0,
              "lista3": 0
          }

          # Procesar en orden de prioridad
          for index, source in enumerate(SOURCES):

              name = f"lista{index + 1}"

              if index == 0:
                  entries = base_entries
              else:
                  _, entries = parse_playlist(source)

              for entry in entries:

                  identifiers = extract_ids(entry)

                  # Descartar si cualquiera de sus IDs ya existe
                  if identifiers.intersection(seen_ids):
                      duplicates[name] += 1
                      continue

                  seen_ids.update(identifiers)

                  # Normalizar todos los enlaces
                  entry = normalize_entry(entry)

                  final_entries.append(entry)
                  stats[name] += 1

          # Actualizar fecha y total
          now = datetime.now(
              ZoneInfo("Europe/Madrid")
          ).strftime("%d/%m/%Y %H:%M:%S")

          total = len(final_entries)

          updated_header = []

          for line in header:

              if line.startswith("# ACTUALIZADO:"):
                  updated_header.append(
                      f"# ACTUALIZADO: {now}"
                  )

              elif line.startswith("# TOTAL CANALES:"):
                  updated_header.append(
                      f"# TOTAL CANALES: {total}"
                  )

              else:
                  updated_header.append(line)

          if not any(
              x.startswith("# ACTUALIZADO:")
              for x in header
          ):
              updated_header.append(
                  f"# ACTUALIZADO: {now}"
              )

          if not any(
              x.startswith("# TOTAL CANALES:")
              for x in header
          ):
              updated_header.append(
                  f"# TOTAL CANALES: {total}"
              )

          # Generar lista definitiva
          output_lines = list(updated_header)

          for entry in final_entries:
              output_lines.extend(entry)

          OUTPUT.write_text(
              "\n".join(output_lines) + "\n",
              encoding="utf-8"
          )

          print("================================")
          print("RESUMEN DE ACTUALIZACIÓN")
          print("================================")

          for name in stats:
              print(
                  f"{name}: {stats[name]} canales añadidos"
              )
              print(
                  f"{name}: {duplicates[name]} duplicados eliminados"
              )

          print("--------------------------------")
          print(f"TOTAL CANALES: {total}")
          print(f"IDENTIFICADORES ÚNICOS: {len(seen_ids)}")
          print("Lista final generada correctamente.")
          print("================================")
          PY

      # 8. Comprobar lista definitiva
      - name: Comprobar lista final
        run: |
          set -e

          test -s pitina.m3u
          grep -q "^#EXTM3U" pitina.m3u

          python3 <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qs, unquote

          content = Path("pitina.m3u").read_text(
              encoding="utf-8"
          )

          entries = re.findall(
              r'^#EXTINF:.*?(?=^#EXTINF:|\Z)',
              content,
              re.MULTILINE | re.DOTALL
          )

          ids = []

          for match in re.findall(
              r'acestream://([^\s"\'<>]+)',
              content,
              re.IGNORECASE
          ):
              raise SystemExit(
                  "ERROR: Queda un enlace acestream:// sin convertir."
              )

          for match in re.findall(
              r'getstream\?[^ \t"\'<>]*',
              content,
              re.IGNORECASE
          ):
              parsed = urlsplit(
                  "http://placeholder/" + match
              )

              values = parse_qs(parsed.query).get("id", [])

              for value in values:
                  ids.append(unquote(value).lower())

          if len(ids) != len(set(ids)):
              raise SystemExit(
                  "ERROR: Se han encontrado IDs getstream repetidos."
              )

          if re.search(
              r'getstream\?id=',
              content,
              re.IGNORECASE
          ):
              if not re.search(
                  r'http://127\.0\.0\.1:6878/ace/getstream\?id=',
                  content
              ):
                  raise SystemExit(
                      "ERROR: Los enlaces locales no tienen el formato esperado."
                  )

          channels = len(
              re.findall(
                  r'^#EXTINF:',
                  content,
                  re.MULTILINE
              )
          )

          print("COMPROBACIÓN CORRECTA")
          print(f"Canales finales: {channels}")
          print(f"IDs getstream: {len(ids)}")
          print("No quedan enlaces acestream://")
          PY

          echo "Tamaño: $(wc -c < pitina.m3u) bytes"

      # 9. Publicar cambios
      - name: Publicar cambios
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pitina.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios. No se crea ningún commit."
          else
            git commit -m "Actualizar listas"
            git push
          fi


name: Actualizar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-26.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      # ==========================================
      # LISTA 1 - IPFS
      # ==========================================

      - name: Resolver IPNS
        env:
          IPNS_NAME_1: "k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs"
        run: |
          set -e

          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            "https://delegated-ipfs.dev/routing/v1/ipns/$IPNS_NAME_1" \
            -o ipns-record.bin

          CID=$(strings ipns-record.bin \
            | grep -oE '/ipfs/[A-Za-z0-9]+' \
            | head -n 1 \
            | sed 's#^/ipfs/##' || true)

          if [ -z "$CID" ]; then
            echo "ERROR: No se pudo resolver IPNS."
            exit 1
          fi

          echo "IPFS_CID=$CID" >> "$GITHUB_ENV"

      - name: Descargar IPFS
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://gateway.pinata.cloud/ipfs/$IPFS_CID/hashes.m3u" \
            -o lista1.m3u

          test -s lista1.m3u
          grep -q "^#EXTM3U" lista1.m3u

      # ==========================================
      # LISTA 2 - BASE
      # ==========================================

      - name: Descargar base.m3u
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://raw.githubusercontent.com/pitinagasolina/pitina/refs/heads/main/base.m3u" \
            -o lista2.m3u

          test -s lista2.m3u
          grep -q "^#EXTM3U" lista2.m3u

      # ==========================================
      # LISTA 3 - BASE2
      # ==========================================

      - name: Descargar base2.m3u
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://raw.githubusercontent.com/pitinagasolina/pitina/refs/heads/main/base2.m3u" \
            -o lista3.m3u

          test -s lista3.m3u
          grep -q "^#EXTM3U" lista3.m3u

      # ==========================================
      # PROCESAR Y GENERAR TRES BLOQUES
      # ==========================================

      - name: Procesar listas por prioridad
        run: |
          set -e

          python3 - <<'PY'
          import re
          from urllib.parse import unquote

          PREFIX = "http://127.0.0.1:6878/ace/getstream?id="

          seen = set()

          def parse(filename):
              with open(filename, encoding="utf-8-sig") as f:
                  lines = f.read().splitlines()

              header = "#EXTM3U"
              entries = []
              current = None

              for line in lines:
                  if line.startswith("#EXTM3U"):
                      header = line
                  elif line.startswith("#EXTINF:"):
                      if current is not None:
                          entries.append(current)
                      current = [line]
                  elif current is not None:
                      current.append(line)

              if current is not None:
                  entries.append(current)

              return header, entries

          def get_id(url):
              url = url.strip()

              if url.lower().startswith("acestream://"):
                  return unquote(
                      url[len("acestream://"):].split("?")[0].split("#")[0]
                  ).strip()

              match = re.search(
                  r'[?&]id=([^&\s]+)',
                  url,
                  re.IGNORECASE
              )

              if match:
                  return unquote(match.group(1)).strip()

              return None

          def process(entries):
              output = []
              duplicates = 0

              for original in entries:
                  entry = list(original)

                  stream_index = None
                  ace_id = None

                  for i, line in enumerate(entry):
                      stripped = line.strip()

                      if not stripped or stripped.startswith("#"):
                          continue

                      stream_index = i
                      ace_id = get_id(stripped)
                      break

                  if ace_id is not None:
                      if not ace_id:
                          continue

                      key = ace_id.lower()

                      if key in seen:
                          duplicates += 1
                          continue

                      seen.add(key)
                      entry[stream_index] = PREFIX + ace_id

                  output.append(entry)

              return output, duplicates

          def write_block(filename, entries):
              with open(filename, "w", encoding="utf-8") as f:
                  for entry in entries:
                      for line in entry:
                          f.write(line + "\n")

          # Leer las tres fuentes
          header, ipfs = parse("lista1.m3u")
          _, base = parse("lista2.m3u")
          _, base2 = parse("lista3.m3u")

          # FASE 1: IPFS
          block1, dup1 = process(ipfs)
          write_block("bloque_ipfs.m3u", block1)

          # FASE 2: BASE
          block2, dup2 = process(base)
          write_block("bloque_base.m3u", block2)

          # FASE 3: BASE2
          sport = [
              e for e in base2
              if "SPORT TV" in "\n".join(e).upper()
              or "SPORT_TV" in "\n".join(e).upper()
          ]

          other = [
              e for e in base2
              if e not in sport
          ]

          sport_block, dup3 = process(sport)
          other_block, dup4 = process(other)

          block3 = sport_block + other_block
          write_block("bloque_base2.m3u", block3)

          # Construcción física y secuencial
          with open("pitina.m3u", "w", encoding="utf-8") as out:
              out.write(header + "\n")

              for filename in [
                  "bloque_ipfs.m3u",
                  "bloque_base.m3u",
                  "bloque_base2.m3u"
              ]:
                  with open(filename, encoding="utf-8") as f:
                      out.write(f.read())

          # Comprobar límites de los bloques
          def count(filename):
              with open(filename, encoding="utf-8") as f:
                  return sum(
                      line.startswith("#EXTINF:")
                      for line in f
                  )

          n1 = count("bloque_ipfs.m3u")
          n2 = count("bloque_base.m3u")
          n3 = count("bloque_base2.m3u")

          final_count = count("pitina.m3u")

          assert final_count == n1 + n2 + n3

          # Verificar que los bloques concatenados son idénticos
          with open("pitina.m3u", encoding="utf-8") as f:
              final_lines = f.read().splitlines()

          with open("bloque_ipfs.m3u", encoding="utf-8") as f:
              b1 = f.read().splitlines()

          with open("bloque_base.m3u", encoding="utf-8") as f:
              b2 = f.read().splitlines()

          with open("bloque_base2.m3u", encoding="utf-8") as f:
              b3 = f.read().splitlines()

          expected = [header] + b1 + b2 + b3
          assert final_lines == expected, "ERROR: Orden de bloques incorrecto"

          print("================================")
          print("ORDEN VERIFICADO")
          print("================================")
          print(f"IPFS: {n1}")
          print(f"BASE: {n2}")
          print(f"BASE2: {n3}")
          print(f"SPORT TV BASE2: {len(sport_block)}")
          print(f"TOTAL: {final_count}")
          print(f"Duplicados eliminados: {dup1 + dup2 + dup3 + dup4}")
          print("Orden: IPFS > BASE > BASE2")
          print("================================")

          PY

      # ==========================================
      # VALIDACIÓN FINAL
      # ==========================================

      - name: Validar lista final
        run: |
          set -e

          test -s pitina.m3u
          grep -q "^#EXTM3U" pitina.m3u

          if grep -qi 'acestream://' pitina.m3u; then
            echo "ERROR: Quedan enlaces acestream://"
            exit 1
          fi

          echo "Canales finales:"
          grep -c '^#EXTINF:' pitina.m3u

          echo "Enlaces locales:"
          grep -c 'http://127.0.0.1:6878/ace/getstream?id=' pitina.m3u || true

      # ==========================================
      # PUBLICAR
      # ==========================================

      - name: Publicar cambios
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pitina.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar lista IPTV unificada"
            git push
          fi

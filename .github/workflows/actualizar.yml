name: Actualizar lista IPTV

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar lista 1
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            "https://tokyo.elcano-ipfs.workers.dev/k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb/data/listas/lista_iptv.m3u" \
            -o lista1.m3u

      - name: Descargar lista 2
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes.m3u" \
            -o lista2.m3u

      - name: Comprobar descargas
        run: |
          test -s lista1.m3u
          test -s lista2.m3u

          grep -q "#EXTM3U" lista1.m3u
          grep -q "#EXTM3U" lista2.m3u

          echo "Lista 1: $(wc -c < lista1.m3u) bytes"
          echo "Lista 2: $(wc -c < lista2.m3u) bytes"

      - name: Combinar listas
        run: |
          {
            head -n 1 lista1.m3u
            tail -n +2 lista1.m3u
            tail -n +2 lista2.m3u
          } > lista.m3u

      - name: Comprobar lista final
        run: |
          test -s lista.m3u
          grep -q "^#EXTM3U" lista.m3u

          echo "Lista final:"
          echo "Tamaño: $(wc -c < lista.m3u) bytes"
          echo "Canales: $(grep -c '^#EXTINF:' lista.m3u || true)"

      - name: Publicar en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lista.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios. No se crea ningún commit."
          else
            git commit -m "Actualizar lista IPTV"
            git push
          fi

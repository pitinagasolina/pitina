name: Resolver IPNS

on:
  workflow_dispatch:

jobs:
  resolver:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar IPFS
        run: |
          wget -q https://dist.ipfs.tech/kubo/v0.38.2/kubo_v0.38.2_linux-amd64.tar.gz
          tar -xzf kubo_v0.38.2_linux-amd64.tar.gz
          sudo bash kubo/install.sh

      - name: Inicializar IPFS
        run: |
          ipfs init --profile=server

      - name: Resolver IPNS
        run: |
          ipfs name resolve \
            k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6peo9o5bu0hu30br5ko08k2gb \
            --offline=false

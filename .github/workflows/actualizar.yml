name: Actualizar

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Descargar lista 1
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes.m3u" \
            -o lista1.m3u

      - name: Descargar lista 2
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            "https://tokyo.elcano-ipfs.workers.dev/k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb/data/listas/lista_iptv.m3u" \
            -o lista2.m3u

      - name: Comprobar descargas
        run: |
          test -s lista1.m3u
          test -s lista2.m3u

          grep -q "#EXTM3U" lista1.m3u
          grep -q "#EXTM3U" lista2.m3u

          echo "Lista 1: $(wc -c < lista1.m3u) bytes"
          echo "Lista 2: $(wc -c < lista2.m3u) bytes"

      - name: Combinar listas
        run: |
          {
            head -n 1 lista1.m3u
            tail -n +2 lista1.m3u
            tail -n +2 lista2.m3u
          } > pitina.m3u

      - name: Comprobar lista final
        run: |
          test -s pitina.m3u
          grep -q "^#EXTM3U" pitina.m3u

          echo "Lista final:"
          echo "Tamaño: $(wc -c < pitina.m3u) bytes"
          echo "Canales: $(grep -c '^#EXTINF:' pitina.m3u || true)"

      - name: Publicar en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Generar lista para OpenTV
        run: |
          python - <<'PY'
          import re

          entrada = "lista.m3u"
          salida = "lista-opentv.m3u"

          with open(entrada, "r", encoding="utf-8", errors="replace") as f:
              lineas = f.readlines()

          # tvg-id utilizado y número de apariciones
          usados = {}
          resultado = []

          patron = re.compile(r'tvg-id="([^"]*)"')

          for linea in lineas:
              if linea.startswith("#EXTINF:"):
                  match = patron.search(linea)

                  if match:
                      tvg_id = match.group(1)

                      if tvg_id:
                          cantidad = usados.get(tvg_id, 0) + 1
                          usados[tvg_id] = cantidad

                          if cantidad > 1:
                              nuevo_id = f"{tvg_id}-{cantidad}"

                              linea = (
                                  linea[:match.start(1)]
                                  + nuevo_id
                                  + linea[match.end(1):]
                              )

              resultado.append(linea)

          with open(salida, "w", encoding="utf-8", newline="") as f:
              f.writelines(resultado)

          total = sum(usados.values())
          duplicados = sum(1 for n in usados.values() if n > 1)

          print("==========================================")
          print("LISTA PARA OPENTV GENERADA")
          print("==========================================")
          print(f"Entradas procesadas: {total}")
          print(f"tvg-id duplicados:   {duplicados}")
          print("Archivo: lista-opentv.m3u")
          print("==========================================")
          PY

          git add pitina.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios. No se crea ningún commit."
          else
            git commit -m "Actualizar"
            git push
          fi

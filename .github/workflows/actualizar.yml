name: Actualizar

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Descargar lista 1
        env:
          M3U_URL: ${{ secrets.M3U_URL_1 }}
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            "$M3U_URL" \
            -o lista1.m3u

      - name: Descargar lista 2
        env:
          M3U_URL: ${{ secrets.M3U_URL_2 }}
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            "$M3U_URL" \
            -o lista2.m3u

      - name: Comprobar descargas
        run: |
          test -s lista1.m3u
          test -s lista2.m3u

          grep -q "#EXTM3U" lista1.m3u
          grep -q "#EXTM3U" lista2.m3u

          echo "Lista 1: $(wc -c < lista1.m3u) bytes"
          echo "Lista 2: $(wc -c < lista2.m3u) bytes"

      - name: Combinar listas
        run: |
          {
            head -n 1 lista1.m3u
            tail -n +2 lista1.m3u
            tail -n +2 lista2.m3u
          } > pitina.m3u

      - name: Comprobar lista final
        run: |
          test -s pitina.m3u
          grep -q "^#EXTM3U" pitina.m3u

          echo "Lista final:"
          echo "Tamaño: $(wc -c < pitina.m3u) bytes"
          echo "Canales: $(grep -c '^#EXTINF:' pitina.m3u || true)"

      - name: Publicar en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pitina.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios. No se crea ningún commit."
          else
            git commit -m "Actualizar"
            git push
          fi

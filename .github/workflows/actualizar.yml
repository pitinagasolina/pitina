
name: Actualizar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-26.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      # LISTA 1 - IPFS / IPNS

      - name: Resolver IPNS de lista 1
        env:
          IPNS_NAME_1: "k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs"
        run: |
          set -e

          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            "https://delegated-ipfs.dev/routing/v1/ipns/$IPNS_NAME_1" \
            -o ipns-record-1.bin

          CID_1=$(strings ipns-record-1.bin \
            | grep -oE '/ipfs/[A-Za-z0-9]+' \
            | head -n 1 \
            | sed 's#^/ipfs/##' || true)

          if [ -z "$CID_1" ]; then
            echo "ERROR: No se pudo obtener el CID."
            exit 1
          fi

          echo "IPFS_CID_1=$CID_1" >> "$GITHUB_ENV"

      - name: Descargar lista IPFS
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://gateway.pinata.cloud/ipfs/$IPFS_CID_1/hashes.m3u" \
            -o lista1.m3u

          test -s lista1.m3u
          grep -q "^#EXTM3U" lista1.m3u

      # LISTA 2 - BASE.M3U

      - name: Descargar base.m3u
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://raw.githubusercontent.com/pitinagasolina/pitina/refs/heads/main/base.m3u" \
            -o lista2.m3u

          test -s lista2.m3u
          grep -q "^#EXTM3U" lista2.m3u

      # LISTA 3 - BASE2.M3U

      - name: Descargar base2.m3u
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://raw.githubusercontent.com/pitinagasolina/pitina/refs/heads/main/base2.m3u" \
            -o lista3.m3u

          test -s lista3.m3u
          grep -q "^#EXTM3U" lista3.m3u

      # UNIFICAR

      - name: Unificar listas respetando prioridad
        run: |
          set -e

          python3 - <<'PY'
          import re
          from urllib.parse import unquote

          PREFIX = "http://127.0.0.1:6878/ace/getstream?id="

          seen = set()
          stats = {}

          def parse_playlist(filename):
              with open(filename, encoding="utf-8-sig") as f:
                  lines = f.read().splitlines()

              preamble = []
              entries = []
              current = None

              for line in lines:
                  if line.startswith("#EXTINF:"):
                      if current is not None:
                          entries.append(current)
                      current = [line]

                  elif current is not None:
                      current.append(line)

                  else:
                      preamble.append(line)

              if current is not None:
                  entries.append(current)

              return preamble, entries

          def extract_id(url):
              url = url.strip()

              if url.lower().startswith("acestream://"):
                  return unquote(
                      url[len("acestream://"):].split("?")[0].split("#")[0]
                  ).strip()

              match = re.search(
                  r'[?&]id=([^&\s]+)',
                  url,
                  re.IGNORECASE
              )

              if match:
                  return unquote(match.group(1)).strip()

              return None

          def is_sport_tv(entry):
              text = "\n".join(entry).upper()
              return "SPORT TV" in text or "SPORT_TV" in text

          def process(entries):
              result = []
              duplicates = 0
              converted = 0

              for original in entries:
                  entry = list(original)

                  stream_index = None
                  ace_id = None

                  for i, line in enumerate(entry):
                      stripped = line.strip()

                      if not stripped or stripped.startswith("#"):
                          continue

                      stream_index = i
                      ace_id = extract_id(stripped)
                      break

                  if ace_id is not None:
                      if not ace_id:
                          continue

                      key = ace_id.lower()

                      if key in seen:
                          duplicates += 1
                          continue

                      seen.add(key)

                      entry[stream_index] = PREFIX + ace_id
                      converted += 1

                  result.append(entry)

              return result, duplicates, converted

          # Cargar las tres listas
          preamble, ipfs = parse_playlist("lista1.m3u")
          _, base = parse_playlist("lista2.m3u")
          _, base2 = parse_playlist("lista3.m3u")

          # Separar SPORT TV de base2 sin alterar el orden relativo
          sport = [e for e in base2 if is_sport_tv(e)]
          other = [e for e in base2 if not is_sport_tv(e)]

          # PROCESAMIENTO ESTRICTO POR PRIORIDAD
          blocks = [
              ("IPFS", ipfs),
              ("BASE", base),
              ("SPORT_TV_BASE2", sport),
              ("RESTO_BASE2", other),
          ]

          final_blocks = {}

          for name, entries in blocks:
              processed, duplicates, converted = process(entries)

              final_blocks[name] = processed

              stats[name] = {
                  "originales": len(entries),
                  "finales": len(processed),
                  "duplicados": duplicates,
                  "convertidos": converted,
              }

          # Construcción explícita: nunca se ordena globalmente
          ordered_names = [
              "IPFS",
              "BASE",
              "SPORT_TV_BASE2",
              "RESTO_BASE2",
          ]

          with open("pitina.m3u", "w", encoding="utf-8") as out:
              header = next(
                  (line for line in preamble if line.startswith("#EXTM3U")),
                  "#EXTM3U"
              )
              out.write(header + "\n")

              for name in ordered_names:
                  for entry in final_blocks[name]:
                      for line in entry:
                          out.write(line + "\n")

          # Comprobaciones
          assert ordered_names == [
              "IPFS",
              "BASE",
              "SPORT_TV_BASE2",
              "RESTO_BASE2",
          ]

          total = sum(
              len(final_blocks[name])
              for name in ordered_names
          )

          print("\n========== RESULTADOS ==========")

          for name in ordered_names:
              print(
                  f"{name}: "
                  f"{stats[name]['finales']} canales "
                  f"(originales: {stats[name]['originales']}, "
                  f"duplicados: {stats[name]['duplicados']})"
              )

          print("--------------------------------")
          print(f"TOTAL FINAL: {total}")
          print(f"SPORT TV base2: {len(final_blocks['SPORT_TV_BASE2'])}")
          print("ORDEN: IPFS > BASE > SPORT TV BASE2 > RESTO BASE2")
          print("================================")

          PY

      # COMPROBAR RESULTADO

      - name: Comprobar lista final
        run: |
          set -e

          test -s pitina.m3u
          grep -q "^#EXTM3U" pitina.m3u

          echo "Canales finales:"
          grep -c '^#EXTINF:' pitina.m3u

          echo "Enlaces locales:"
          grep -c 'http://127.0.0.1:6878/ace/getstream?id=' pitina.m3u || true

          if grep -q 'acestream://' pitina.m3u; then
            echo "ERROR: Quedan enlaces acestream://"
            exit 1
          fi

      # PUBLICAR

      - name: Publicar cambios
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pitina.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar lista IPTV unificada"
            git push
          fi

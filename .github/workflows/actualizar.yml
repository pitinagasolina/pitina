name: Actualizar

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Analizar proxy Elcano
        run: |
          set -e

          echo "=== LISTA 1 ==="
          curl -fsSL \
            --max-time 60 \
            "https://tokyo.elcano-ipfs.workers.dev/k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb/" \
            -o elcano-lista1.html

          echo "Tamaño respuesta lista 1:"
          wc -c elcano-lista1.html

          echo "Contenido lista 1:"
          cat elcano-lista1.html

          echo
          echo "=== LISTA 2 ==="
          curl -fsSL \
            --max-time 60 \
            "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/" \
            -o elcano-lista2.html

          echo "Tamaño respuesta lista 2:"
          wc -c elcano-lista2.html

          echo "Contenido lista 2:"
          cat elcano-lista2.html
    
      - name: Resolver IPNS de lista 1
        env:
          IPNS_NAME_1: "k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb"
        run: |
          set -e
    
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            "https://delegated-ipfs.dev/routing/v1/ipns/$IPNS_NAME_1" \
            -o ipns-record-1.bin
    
          CID_1=$(strings ipns-record-1.bin \
            | grep -oE '/ipfs/[A-Za-z0-9]+' \
            | head -n 1 \
            | sed 's#^/ipfs/##')
    
          if [ -z "$CID_1" ]; then
            echo "ERROR: No se pudo obtener el CID de la lista 1."
            exit 1
          fi
    
          echo "CID lista 1: $CID_1"
          echo "IPFS_CID_1=$CID_1" >> "$GITHUB_ENV"
    
      - name: Descargar lista 1
        run: |
          set -e
    
          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://gateway.pinata.cloud/ipfs/$IPFS_CID_1/data/listas/lista_iptv.m3u" \
            -o lista1.m3u
    
          test -s lista1.m3u
    
      - name: Resolver IPNS de lista 2
        env:
          IPNS_NAME_2: "k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs"
        run: |
          set -e
    
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            "https://delegated-ipfs.dev/routing/v1/ipns/$IPNS_NAME_2" \
            -o ipns-record-2.bin
    
          CID_2=$(strings ipns-record-2.bin \
            | grep -oE '/ipfs/[A-Za-z0-9]+' \
            | head -n 1 \
            | sed 's#^/ipfs/##')
    
          if [ -z "$CID_2" ]; then
            echo "ERROR: No se pudo obtener el CID de la lista 2."
            exit 1
          fi
    
          echo "CID lista 2: $CID_2"
          echo "IPFS_CID_2=$CID_2" >> "$GITHUB_ENV"
    
      - name: Descargar lista 2
        run: |
          set -e
    
          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://gateway.pinata.cloud/ipfs/$IPFS_CID_2/hashes.m3u" \
            -o lista2.m3u
    
          test -s lista2.m3u
    
      - name: Comprobar descargas
        run: |
          set -e
    
          test -s lista1.m3u
          test -s lista2.m3u
    
          grep -q "#EXTM3U" lista1.m3u
          grep -q "#EXTM3U" lista2.m3u
    
          echo "Lista 1: $(wc -c < lista1.m3u) bytes"
          echo "Lista 2: $(wc -c < lista2.m3u) bytes"
    
      - name: Combinar listas
        run: |
          set -e
    
          {
            head -n 1 lista1.m3u
            tail -n +2 lista1.m3u
            tail -n +2 lista2.m3u
          } > pitina.m3u
    
      - name: Comprobar lista final
        run: |
          set -e
    
          test -s pitina.m3u
          grep -q "^#EXTM3U" pitina.m3u
    
          echo "Lista final:"
          echo "Tamaño: $(wc -c < pitina.m3u) bytes"
          echo "Canales: $(grep -c '^#EXTINF:' pitina.m3u || true)"
    
      - name: Publicar cambios
        run: |
          set -e
    
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
          git add pitina.m3u
    
          if git diff --cached --quiet; then
            echo "No hay cambios. No se crea ningún commit."
          else
            git commit -m "Actualizar listas"
            git push
          fi

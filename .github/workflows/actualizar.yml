
name: Actualizar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-26.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      # ==========================================
      # LISTA 1 - IPFS / IPNS (LISTA PRINCIPAL)
      # ==========================================

      - name: Descargar lista 1 desde IPNS
        env:
          IPNS_NAME_1: "k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb"
        run: |
          set -e

          URL_PATH="/data/listas/lista_iptv.m3u"

          GATEWAYS=(
            "https://gateway.pinata.cloud"
            "https://ipfs.io"
            "https://dweb.link"
          )

          DESCARGADA=false

          for GATEWAY in "${GATEWAYS[@]}"; do

            echo "Probando gateway: $GATEWAY"

            if curl -fL \
              --retry 2 \
              --retry-delay 5 \
              --max-time 180 \
              "$GATEWAY/ipns/$IPNS_NAME_1$URL_PATH" \
              -o lista1.tmp; then

              if test -s lista1.tmp && grep -q "^#EXTM3U" lista1.tmp; then
                mv lista1.tmp lista1.m3u
                echo "Lista 1 descargada correctamente."
                echo "Gateway utilizado: $GATEWAY"
                DESCARGADA=true
                break
              fi
            fi

            rm -f lista1.tmp
            echo "Gateway no válido. Probando el siguiente."
          done

          if [ "$DESCARGADA" != "true" ]; then
            echo "ERROR: No se pudo descargar una lista M3U válida desde IPNS."
            exit 1
          fi

          echo "Canales lista 1: $(grep -c '^#EXTINF:' lista1.m3u)"

      # ==========================================
      # LISTA 2 - BASE.M3U
      # ==========================================

      - name: Descargar lista 2 (base.m3u)
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://raw.githubusercontent.com/pitinagasolina/pitina/refs/heads/main/base.m3u" \
            -o lista2.m3u

          test -s lista2.m3u
          grep -q "^#EXTM3U" lista2.m3u

      # ==========================================
      # LISTA 3 - BASE2.M3U
      # ==========================================

      - name: Descargar lista 3 (base2.m3u)
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://raw.githubusercontent.com/pitinagasolina/pitina/refs/heads/main/base2.m3u" \
            -o lista3.m3u

          test -s lista3.m3u
          grep -q "^#EXTM3U" lista3.m3u

      # ==========================================
      # COMPROBAR DESCARGAS
      # ==========================================

      - name: Comprobar descargas
        run: |
          set -e

          for file in lista1.m3u lista2.m3u lista3.m3u; do
            test -s "$file"
            grep -q "^#EXTM3U" "$file"

            echo "$file: $(wc -c < "$file") bytes"
            echo "Canales: $(grep -c '^#EXTINF:' "$file" || true)"
          done

      # ==========================================
      # UNIFICAR Y ELIMINAR DUPLICADOS
      # ==========================================

      - name: Unificar listas y normalizar AceStream
        run: |
          set -e

          python3 - <<'PY'
          import re
          from urllib.parse import unquote

          FILES = [
              "lista1.m3u",
              "lista2.m3u",
              "lista3.m3u"
          ]

          OUTPUT = "pitina.m3u"

          LOCAL_PREFIX = "http://127.0.0.1:6878/ace/getstream?id="

          seen = set()
          total = 0
          duplicates = 0
          converted = 0

          def parse_playlist(filename):
              with open(filename, "r", encoding="utf-8-sig") as f:
                  lines = f.read().splitlines()

              preamble = []
              entries = []
              current = None

              for line in lines:
                  if line.startswith("#EXTINF:"):
                      if current is not None:
                          entries.append(current)

                      current = [line]

                  elif current is not None:
                      current.append(line)

                  else:
                      preamble.append(line)

              if current is not None:
                  entries.append(current)

              return preamble, entries

          def extract_id(url):
              url = url.strip()

              if url.lower().startswith("acestream://"):
                  return unquote(
                      url[len("acestream://"):].split("?")[0].split("#")[0]
                  ).strip()

              match = re.search(
                  r'[?&]id=([^&\s]+)',
                  url,
                  re.IGNORECASE
              )

              if match:
                  return unquote(match.group(1)).strip()

              return None

          def is_sport_tv(entry):
              text = "\n".join(entry).upper()

              return (
                  "SPORT TV" in text
                  or "SPORT_TV" in text
              )

          def process_entries(entries):
              global total, duplicates, converted

              result = []

              for entry in entries:
                  stream_index = None
                  ace_id = None

                  for i, line in enumerate(entry):
                      stripped = line.strip()

                      if not stripped or stripped.startswith("#"):
                          continue

                      stream_index = i
                      ace_id = extract_id(stripped)
                      break

                  if ace_id is not None:
                      if not ace_id:
                          continue

                      normalized_id = ace_id.lower()

                      if normalized_id in seen:
                          duplicates += 1
                          continue

                      seen.add(normalized_id)

                      entry[stream_index] = LOCAL_PREFIX + ace_id
                      converted += 1

                  result.append(entry)
                  total += 1

              return result

          # Cabecera de la lista principal
          preamble, entries1 = parse_playlist(FILES[0])

          # Leer listas 2 y 3
          _, entries2 = parse_playlist(FILES[1])
          _, entries3 = parse_playlist(FILES[2])

          final_entries = []

          # PRIORIDAD 1: LISTA IPNS
          final_entries.extend(process_entries(entries1))

          # PRIORIDAD 2: BASE.M3U
          final_entries.extend(process_entries(entries2))

          # PRIORIDAD 3: BASE2.M3U
          # SPORT TV primero, respetando el orden original.
          sport_entries = [
              entry for entry in entries3
              if is_sport_tv(entry)
          ]

          other_entries = [
              entry for entry in entries3
              if not is_sport_tv(entry)
          ]

          print(f"SPORT TV detectados en base2: {len(sport_entries)}")

          # Primero SPORT TV
          final_entries.extend(process_entries(sport_entries))

          # Después los demás canales de base2
          final_entries.extend(process_entries(other_entries))

          # Escribir lista final
          with open(OUTPUT, "w", encoding="utf-8") as out:

              for line in preamble:
                  if line.strip():
                      out.write(line + "\n")

              for entry in final_entries:
                  for line in entry:
                      out.write(line + "\n")

          print("--------------------------------")
          print("UNIFICACIÓN FINALIZADA")
          print(f"Canales finales: {total}")
          print(f"Duplicados eliminados: {duplicates}")
          print(f"Enlaces normalizados: {converted}")
          print(f"SPORT TV detectados en base2: {len(sport_entries)}")
          print("--------------------------------")

          PY

      # ==========================================
      # COMPROBAR LISTA FINAL
      # ==========================================

      - name: Comprobar lista final
        run: |
          set -e

          test -s pitina.m3u
          grep -q "^#EXTM3U" pitina.m3u

          echo "================================"
          echo "LISTA FINAL"
          echo "================================"

          echo "Tamaño: $(wc -c < pitina.m3u) bytes"

          echo "Canales: $(grep -c '^#EXTINF:' pitina.m3u || true)"

          echo "Enlaces locales:"
          grep -c 'http://127.0.0.1:6878/ace/getstream?id=' pitina.m3u || true

          echo "Enlaces AceStream antiguos:"
          grep -c 'acestream://' pitina.m3u || true

          echo "================================"

      # ==========================================
      # PUBLICAR CAMBIOS
      # ==========================================

      - name: Publicar cambios
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pitina.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios. No se crea ningún commit."
          else
            git commit -m "Actualizar lista IPTV unificada"
            git push
          fi

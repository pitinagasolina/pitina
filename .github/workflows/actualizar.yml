
name: Actualizar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-26.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      # ==========================================
      # LISTA 1 - IPFS / IPNS
      # ==========================================

      - name: Resolver IPNS de lista principal
        env:
          IPNS_NAME_1: "k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs"
        run: |
          set -e

          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            "https://delegated-ipfs.dev/routing/v1/ipns/$IPNS_NAME_1" \
            -o ipns-record-1.bin

          CID_1=$(strings ipns-record-1.bin \
            | grep -oE '/ipfs/[A-Za-z0-9]+' \
            | head -n 1 \
            | sed 's#^/ipfs/##' || true)

          if [ -z "$CID_1" ]; then
            echo "ERROR: No se pudo obtener el CID de IPNS."
            exit 1
          fi

          echo "CID principal: $CID_1"
          echo "IPFS_CID_1=$CID_1" >> "$GITHUB_ENV"

      - name: Descargar lista IPFS
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://gateway.pinata.cloud/ipfs/$IPFS_CID_1/hashes.m3u" \
            -o lista1.m3u

          test -s lista1.m3u
          grep -q "^#EXTM3U" lista1.m3u

      # ==========================================
      # LISTA 2 - BASE.M3U
      # ==========================================

      - name: Descargar base.m3u
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://raw.githubusercontent.com/pitinagasolina/pitina/refs/heads/main/base.m3u" \
            -o lista2.m3u

          test -s lista2.m3u
          grep -q "^#EXTM3U" lista2.m3u

      # ==========================================
      # LISTA 3 - BASE2.M3U
      # ==========================================

      - name: Descargar base2.m3u
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --max-time 120 \
            "https://raw.githubusercontent.com/pitinagasolina/pitina/refs/heads/main/base2.m3u" \
            -o lista3.m3u

          test -s lista3.m3u
          grep -q "^#EXTM3U" lista3.m3u

      # ==========================================
      # COMPROBAR DESCARGAS
      # ==========================================

      - name: Comprobar descargas
        run: |
          set -e

          for file in lista1.m3u lista2.m3u lista3.m3u; do
            test -s "$file"
            grep -q "^#EXTM3U" "$file"

            echo "$file: $(wc -c < "$file") bytes"
            echo "Canales: $(grep -c '^#EXTINF:' "$file" || true)"
          done

      # ==========================================
      # UNIFICAR Y ORDENAR POR PROCEDENCIA
      # ==========================================

      - name: Unificar listas y ordenar canales
        run: |
          set -e

          python3 - <<'PY'
          import re
          from urllib.parse import unquote

          LOCAL_PREFIX = "http://127.0.0.1:6878/ace/getstream?id="

          FILES = [
              ("IPFS", "lista1.m3u"),
              ("BASE", "lista2.m3u"),
              ("BASE2", "lista3.m3u"),
          ]

          seen = set()
          stats = {
              "IPFS": 0,
              "BASE": 0,
              "BASE2": 0,
          }

          duplicates = 0
          converted = 0

          def parse_playlist(filename):
              with open(filename, "r", encoding="utf-8-sig") as f:
                  lines = f.read().splitlines()

              preamble = []
              entries = []
              current = None

              for line in lines:
                  if line.startswith("#EXTINF:"):
                      if current is not None:
                          entries.append(current)

                      current = [line]

                  elif current is not None:
                      current.append(line)

                  elif line.strip() and not line.startswith("#EXTM3U"):
                      preamble.append(line)

              if current is not None:
                  entries.append(current)

              return preamble, entries

          def extract_id(url):
              url = url.strip()

              if url.lower().startswith("acestream://"):
                  return unquote(
                      url[len("acestream://"):].split("?")[0].split("#")[0]
                  ).strip()

              match = re.search(
                  r'[?&]id=([^&\s]+)',
                  url,
                  re.IGNORECASE
              )

              if match:
                  return unquote(match.group(1)).strip()

              return None

          def is_sport_tv(entry):
              text = "\n".join(entry).upper()

              return (
                  "SPORT TV" in text
                  or "SPORT_TV" in text
              )

          def process_entries(entries, source):
              global duplicates, converted

              result = []

              for entry in entries:
                  entry = list(entry)

                  stream_index = None
                  ace_id = None

                  for i, line in enumerate(entry):
                      stripped = line.strip()

                      if not stripped or stripped.startswith("#"):
                          continue

                      stream_index = i
                      ace_id = extract_id(stripped)
                      break

                  if ace_id is not None:
                      if not ace_id:
                          continue

                      normalized_id = ace_id.lower()

                      # La primera lista que contiene el ID gana.
                      if normalized_id in seen:
                          duplicates += 1
                          continue

                      seen.add(normalized_id)

                      original = entry[stream_index]

                      if not original.startswith(LOCAL_PREFIX):
                          converted += 1

                      entry[stream_index] = LOCAL_PREFIX + ace_id

                  result.append(entry)
                  stats[source] += 1

              return result

          # Leer las tres listas.
          preamble, entries1 = parse_playlist(FILES[0][1])
          _, entries2 = parse_playlist(FILES[1][1])
          _, entries3 = parse_playlist(FILES[2][1])

          # Crear bloques independientes por procedencia.
          # El orden de prioridad es inalterable.

          ipfs_entries = process_entries(entries1, "IPFS")

          base_entries = process_entries(entries2, "BASE")

          # SPORT TV primero dentro de BASE2.
          sport_entries = [
              e for e in entries3 if is_sport_tv(e)
          ]

          other_entries = [
              e for e in entries3 if not is_sport_tv(e)
          ]

          base2_sport = process_entries(sport_entries, "BASE2")
          base2_other = process_entries(other_entries, "BASE2")

          # ORDEN FINAL EXPLÍCITO.
          final_entries = (
              ipfs_entries
              + base_entries
              + base2_sport
              + base2_other
          )

          # Escribir resultado.
          with open("pitina.m3u", "w", encoding="utf-8") as out:

              out.write("#EXTM3U\n")

              for entry in final_entries:
                  for line in entry:
                      out.write(line + "\n")

          # ======================================
          # VERIFICACIÓN DEL ORDEN
          # ======================================

          print("")
          print("========== RESULTADOS ==========")
          print(f"Canales IPFS: {stats['IPFS']}")
          print(f"Canales BASE: {stats['BASE']}")
          print(f"Canales BASE2: {stats['BASE2']}")
          print(f"Canales finales: {len(final_entries)}")
          print(f"Duplicados eliminados: {duplicates}")
          print(f"Enlaces convertidos: {converted}")
          print(f"SPORT TV encontrados en BASE2: {len(sport_entries)}")

          print("")
          print("Orden de procedencia:")
          print("1. IPFS")
          print("2. BASE")
          print("3. BASE2 SPORT TV")
          print("4. BASE2 restantes")

          print("================================")

          PY

      # ==========================================
      # VALIDAR RESULTADO FINAL
      # ==========================================

      - name: Comprobar lista final
        run: |
          set -e

          test -s pitina.m3u
          grep -q "^#EXTM3U" pitina.m3u

          echo "================================"
          echo "COMPROBACIÓN FINAL"
          echo "================================"

          echo "Tamaño: $(wc -c < pitina.m3u) bytes"
          echo "Canales: $(grep -c '^#EXTINF:' pitina.m3u || true)"

          if grep -q 'acestream://' pitina.m3u; then
            echo "ERROR: Quedan enlaces acestream://"
            exit 1
          fi

          if grep -v '^#' pitina.m3u | grep -v '^http://127.0.0.1:6878/ace/getstream?id='; then
            echo "ERROR: Se ha encontrado un enlace fuera del formato local."
            exit 1
          fi

          echo "Todos los enlaces tienen el formato local correcto."

          echo "================================"

      # ==========================================
      # PUBLICAR CAMBIOS
      # ==========================================

      - name: Publicar cambios
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pitina.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios. No se crea ningún commit."
          else
            git commit -m "Actualizar lista IPTV unificada"
            git push
          fi
